<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F2E9">
<title>KMON - Korean Monster Universe</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg:#F7F2E9; --panel:#fff; --line:#e5dccd;
  --text:#202b4b; --muted:#737d91; --orange:#E58A32; --navy:#5276a5;
}
html { scroll-behavior:smooth; scroll-padding-top:20px; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:Arial,"Noto Sans KR",sans-serif;
  padding-bottom:76px; overflow-x:hidden;
}
body.intro-active { padding:0; overflow:hidden; }
a { color:inherit; text-decoration:none; }
main { width:100%; max-width:900px; margin:0 auto; }
section { padding:30px 20px; }

/* 인트로 */
.intro-screen {
  position:fixed; inset:0; z-index:1000;
  display:flex; align-items:center; justify-content:center;
  width:100%; height:100vh; height:100dvh;
  overflow:hidden; background:#17131c;
}
.intro-art {
  position:relative;
  width:min(100vw,calc(100dvh * 9 / 16));
  aspect-ratio:9 / 16; flex:0 0 auto; overflow:hidden;
}
.intro-image {
  display:block; width:100%; height:100%; object-fit:contain;
}
.effect-layer {
  position:absolute; inset:0; overflow:hidden;
  pointer-events:none; z-index:2;
}

/* 번개: 위쪽은 여러 갈래로 퍼지고 아래쪽은 한 줄기로 모이는 형태 */
.lightning-layer {
  position:absolute; inset:0; width:100%; height:100%;
  z-index:3; pointer-events:none; overflow:visible;
}
.lightning-glow, .lightning-bolt {
  fill:none; stroke-linecap:round; stroke-linejoin:round;
  opacity:0;
}
.lightning-glow {
  stroke:#c7a0ff; stroke-width:1.5;
  filter:blur(2.8px);
}
.lightning-bolt {
  stroke:#fffaff; stroke-width:.34;
  filter:drop-shadow(0 0 1.5px #fff)
         drop-shadow(0 0 4px #d6aaff)
         drop-shadow(0 0 8px #9862f2);
}
.bolt-one,.glow-one { animation:storm-flash-one 8.7s infinite; }
.bolt-two,.glow-two { animation:storm-flash-two 11.3s infinite; }
.bolt-three,.glow-three { animation:storm-flash-three 9.9s infinite; }

/* 각 번개 주변 보라색 구름의 짧은 반사광 */
.cloud-light {
  opacity:0; fill:#b78cff; filter:blur(12px);
  mix-blend-mode:screen;
}
.cloud-light-one { animation:cloud-flash-one 8.7s infinite; }
.cloud-light-two { animation:cloud-flash-two 11.3s infinite; }
.cloud-light-three { animation:cloud-flash-three 9.9s infinite; }

@keyframes storm-flash-one {
  0%,18%,100% { opacity:0; }
  18.22% { opacity:1; }
  18.38% { opacity:.08; }
  18.52% { opacity:.9; }
  18.78%,19.1% { opacity:0; }
}
@keyframes storm-flash-two {
  0%,43%,100% { opacity:0; }
  43.2% { opacity:1; }
  43.36% { opacity:.06; }
  43.5% { opacity:.82; }
  43.76%,44.1% { opacity:0; }
}
@keyframes storm-flash-three {
  0%,31%,100% { opacity:0; }
  31.2% { opacity:.95; }
  31.36% { opacity:.06; }
  31.5% { opacity:.78; }
  31.76%,32.1% { opacity:0; }
}
@keyframes cloud-flash-one {
  0%,18%,100% { opacity:0; }
  18.25% { opacity:.28; }
  18.5% { opacity:.08; }
  18.62% { opacity:.2; }
  18.9% { opacity:0; }
}
@keyframes cloud-flash-two {
  0%,43%,100% { opacity:0; }
  43.23% { opacity:.24; }
  43.48% { opacity:.06; }
  43.6% { opacity:.17; }
  43.9% { opacity:0; }
}
@keyframes cloud-flash-three {
  0%,31%,100% { opacity:0; }
  31.23% { opacity:.25; }
  31.48% { opacity:.06; }
  31.6% { opacity:.17; }
  31.9% { opacity:0; }
}

/* 성에 생기는 반사광 */
.castle-flash {
  position:absolute; pointer-events:none; z-index:2; opacity:0;
  mix-blend-mode:screen;
  background:linear-gradient(90deg,
    rgba(210,220,255,0) 0%,
    rgba(225,230,255,.2) 35%,
    rgba(245,246,255,.42) 52%,
    rgba(205,216,255,.12) 78%,
    rgba(210,220,255,0) 100%);
}
.castle-flash.spire {
  left:7%; top:27%; width:10%; height:5%;
  transform:rotate(-24deg); filter:blur(3px);
  animation:castle-reflect-one 8.7s infinite;
}
.castle-flash.wall {
  left:2%; top:34%; width:17%; height:2.5%;
  transform:rotate(-3deg); filter:blur(4px);
  animation:castle-reflect-one 8.7s infinite;
}
.castle-flash.spire-two {
  left:12%; top:25%; width:8%; height:4%;
  transform:rotate(18deg); filter:blur(3px);
  animation:castle-reflect-two 11.3s infinite;
}
.castle-flash.wall-two {
  left:5%; top:36%; width:13%; height:2%;
  transform:rotate(2deg); filter:blur(4px);
  animation:castle-reflect-two 11.3s infinite;
}
@keyframes sky-flash-one {
  0%,18%,100% { opacity:0; }
  18.25% { opacity:.52; }
  18.42% { opacity:.04; }
  18.58% { opacity:.34; }
  18.82% { opacity:0; }
  19.05% { opacity:.12; }
  19.18% { opacity:0; }
}
@keyframes castle-reflect-one {
  0%,18%,100% { opacity:0; }
  18.25% { opacity:.8; }
  18.42% { opacity:.08; }
  18.58% { opacity:.52; }
  18.82% { opacity:0; }
  19.05% { opacity:.18; }
  19.18% { opacity:0; }
}
@keyframes castle-reflect-two {
  0%,43%,100% { opacity:0; }
  43.2% { opacity:.7; }
  43.38% { opacity:.06; }
  43.55% { opacity:.42; }
  43.78% { opacity:0; }
  44% { opacity:.15; }
  44.12% { opacity:0; }
}

/* 화면 전체의 아주 약한 섬광 */
.effect-layer::after {
  content:""; position:absolute; inset:-2%; z-index:1;
  pointer-events:none; opacity:0;
  background:linear-gradient(24deg,
    rgba(175,190,255,.04),
    rgba(232,237,255,.17) 48%,
    rgba(180,194,255,.05));
  mix-blend-mode:screen;
  animation:sky-flash-two 11.3s infinite;
}

/* 벚꽃잎 */
.petal {
  position:absolute; top:-8%; width:12px; height:17px;
  border-radius:80% 10% 80% 10%;
  background:linear-gradient(135deg,#fff0fa,#ffb6d8 55%,#ed78b4);
  box-shadow:0 0 5px rgba(255,180,220,.35);
  opacity:0; animation:petal-fall linear infinite;
}
.petal:nth-child(7) { left:72%; animation-duration:9s; animation-delay:0s; }
.petal:nth-child(8) { left:87%; width:9px; height:13px; animation-duration:11s; animation-delay:2s; }
.petal:nth-child(9) { left:94%; animation-duration:8s; animation-delay:4s; }
.petal:nth-child(10) { left:78%; width:8px; height:12px; animation-duration:10s; animation-delay:5s; }
.petal:nth-child(11) { left:98%; animation-duration:12s; animation-delay:1s; }
.petal:nth-child(12) { left:67%; width:10px; height:14px; animation-duration:9.5s; animation-delay:3s; }
.petal:nth-child(13) { left:83%; animation-duration:13s; animation-delay:6s; }
.petal:nth-child(14) { left:91%; width:7px; height:11px; animation-duration:10.5s; animation-delay:7s; }

@keyframes petal-fall {
  0% { transform:translate3d(0,-5vh,0) rotate(0deg); opacity:0; }
  10% { opacity:.9; }
  50% { transform:translate3d(-24px,52vh,0) rotate(240deg); opacity:.85; }
  90% { opacity:.7; }
  100% { transform:translate3d(25px,112vh,0) rotate(560deg); opacity:0; }
}

/* 입장 버튼 효과: 원본 이미지 버튼 테두리와 겹치도록 */
.intro-enter {
  position:absolute; z-index:5;
  left:24.5%; top:87.35%;
  width:51%; height:5.45%;
  min-height:0; padding:0;
  border:0; border-radius:999px; background:transparent;
  overflow:hidden; isolation:isolate; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.intro-enter::before {
  content:""; position:absolute; inset:0; z-index:2;
  border:1px solid rgba(255,231,177,0);
  border-radius:inherit;
  box-shadow:inset 0 0 0 rgba(255,238,194,0);
  animation:button-edge-sparkle 3.1s ease-in-out infinite;
  pointer-events:none;
}
.intro-enter::after {
  content:""; position:absolute; z-index:1; top:0; bottom:0;
  left:-45%; width:32%; border-radius:inherit;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,225,.12) 25%,rgba(255,222,145,.75) 50%,rgba(255,255,225,.12) 75%,transparent 100%);
  animation:gold-shine 3.1s ease-in-out infinite;
  pointer-events:none;
}
@keyframes gold-shine {
  0% { left:-45%; }
  65%,100% { left:115%; }
}
@keyframes button-edge-sparkle {
  0%,100% { border-color:rgba(255,231,177,0); box-shadow:inset 0 0 0 rgba(255,238,194,0); }
  42% { border-color:rgba(255,231,177,.88); box-shadow:inset 0 0 5px rgba(255,238,194,.4),0 0 4px rgba(255,225,165,.45); }
  58% { border-color:rgba(255,231,177,.16); box-shadow:inset 0 0 2px rgba(255,238,194,.12); }
}
.button-sparkle {
  position:absolute; z-index:3; top:50%; width:8px; height:8px;
  opacity:0; transform:translateY(-50%) scale(.35) rotate(45deg);
  background:#fff9df;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  filter:drop-shadow(0 0 3px #fff0b5);
  animation:button-star 3.1s ease-in-out infinite;
  pointer-events:none;
}
.button-sparkle.left { left:7%; }
.button-sparkle.right { right:7%; animation-delay:1.55s; }
@keyframes button-star {
  0%,100% { opacity:0; transform:translateY(-50%) scale(.3) rotate(0deg); }
  43% { opacity:.95; transform:translateY(-50%) scale(1) rotate(45deg); }
  60% { opacity:.12; transform:translateY(-50%) scale(.45) rotate(80deg); }
}
.intro-screen.hide {
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .55s ease,visibility .55s ease;
}
@media (min-width:768px) {
  .intro-art { width:min(520px,100vw,calc(100dvh * 9 / 16)); }
}
@media (prefers-reduced-motion:reduce) {
  .intro-enter::after,.intro-enter::before,.button-sparkle,.petal,
  .lightning-bolt,.lightning-glow,.cloud-light { animation:none; }
}

/* 홈페이지 */
#home-page { display:none; }
.world-banner {
  width:100%; max-width:900px; aspect-ratio:2.5 / 1;
  margin:0 auto; padding:0; overflow:hidden;
}
.world-banner img {
  display:block; width:100%; height:100%;
  object-fit:cover; object-position:center;
}
.bestiary-heading { margin:0; line-height:1; }
.label {
  color:#65718d; font-size:10px; font-weight:700;
  letter-spacing:1.5px; line-height:1; margin-bottom:2px;
}
.bestiary-title {
  display:flex; align-items:baseline; margin:0;
  padding:0; line-height:1; white-space:nowrap;
}
.bestiary-title .title-k {
  color:var(--orange); font-family:Arial,sans-serif;
  font-size:39px; font-weight:900; letter-spacing:-2px;
  line-height:1; margin-right:1px;
}
.bestiary-title .title-text {
  color:var(--navy); font-family:Arial,"Noto Sans KR",sans-serif;
  font-size:30px; font-weight:900; letter-spacing:-1.5px; line-height:1;
}
.intro { color:var(--muted); line-height:1.3; font-size:13px; margin:2px 0 0; }

/* 도감 */
.cards {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px; margin-top:20px;
}
.card {
  min-width:0; padding:10px; border:1px solid var(--line);
  border-radius:12px; background:var(--panel); color:var(--text);
}
.card-link { display:block; transition:transform .15s ease; }
.card-link:active { transform:scale(.98); }
.card-art {
  width:100%; aspect-ratio:1 / 1; display:flex;
  align-items:center; justify-content:center; overflow:hidden;
  margin-bottom:10px; border-radius:8px; background:#eee8df;
  color:var(--muted); font-size:11px; text-align:center;
}
.card-art img { display:block; width:100%; height:100%; object-fit:contain; }
.card h3 { margin:8px 0; font-size:15px; }
.card p { margin:0; color:var(--muted); font-size:12px; line-height:1.6; }
.feature {
  padding:20px; border:1px solid var(--line); border-radius:12px;
  background:var(--panel); color:var(--muted); font-size:14px; line-height:1.7;
}
footer { padding:25px 20px; color:#9299ad; text-align:center; font-size:12px; }

/* 하단 메뉴 */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  display:grid; grid-template-columns:repeat(4,1fr);
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  background:#fff; border-top:1px solid var(--line);
}
.bottom-nav a {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4px; min-height:48px;
  color:var(--muted); font-size:11px;
}
.bottom-nav .nav-icon { font-size:20px; }
.bottom-nav a:hover,.bottom-nav a:focus { color:var(--navy); }

/* 캐릭터 상세 */
.character-detail { display:none; min-height:80vh; padding:24px 20px 40px; }
.detail-back {
  display:inline-flex; align-items:center; gap:7px; margin-bottom:24px;
  padding:10px 15px; border:1px solid var(--line); border-radius:20px;
  background:#fff; color:var(--navy); font-size:13px; font-weight:700;
}
.detail-heading { margin-bottom:22px; }
.detail-heading .label { margin-bottom:8px; }
.detail-heading h1 { margin:0; color:var(--navy); font-size:32px; font-weight:900; }
.detail-intro { margin:9px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
.character-gallery { display:flex; flex-direction:column; gap:18px; }
.character-gallery img {
  display:block; width:100%; height:auto; border-radius:12px; background:#eee8df;
}
.character-description {
  padding:16px; border:1px solid var(--line); border-radius:12px;
  background:#fff; color:var(--text); font-size:15px;
  line-height:1.5; white-space:pre-line;
}
.detail-bottom { margin-top:28px; text-align:center; }
.detail-bottom .detail-back { margin-bottom:0; }
@media (min-width:700px) {
  section { padding:42px 30px; }
  .bottom-nav { left:50%; right:auto; width:min(100%,900px); transform:translateX(-50%); }
  .character-detail { padding:35px 30px 50px; }
  .character-gallery { gap:24px; }
}
@media (max-width:380px) {
  .bestiary-title .title-k { font-size:36px; }
  .bestiary-title .title-text { font-size:27px; }
}
</style>
</head>
<body class="intro-active">
